<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<title>Imagen para compartir el enlace · 1200 × 630</title>
<!-- Pieza de campaña con el manual de marca v1.0: logo maestro, Manrope, negro/dorado/hueso,
     el Puma como único recurso y sin efectos sobre el logo. Se captura a PNG con
     herramientas/capturar.js (1200 × 630). La oferta es temporal (octubre de 2026):
     el logo permanente no lleva precios ni fechas. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;background:#000;overflow:hidden;font-family:'Manrope',system-ui,sans-serif;color:#EDEDEA}
  .lienzo{position:relative;width:1200px;height:630px;background:radial-gradient(60% 90% at 84% 58%,rgba(245,197,24,.16),transparent 70%),#000}
  .logo{position:absolute;left:56px;top:44px;height:96px}
  .texto{position:absolute;left:72px;top:176px;width:640px}
  .kicker{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:20px;letter-spacing:.08em;color:#F5C518;text-transform:uppercase}
  h1{margin-top:18px;font-weight:800;font-size:70px;line-height:1.08;letter-spacing:-.025em;color:#EDEDEA}
  .cta{position:absolute;left:72px;bottom:60px;display:inline-block;padding:18px 30px;border-radius:14px;background:#F5C518;color:#000;font-weight:700;font-size:28px;line-height:1}
  .puma{position:absolute;right:20px;bottom:0;height:610px}
</style>
</head>
<body>
<div class="lienzo">
  <img class="logo" src="../../assets/img/marca/logo-horizontal.svg" alt="YACHAI">
  <div class="texto">
    <p class="kicker">Agencia de IA y marketing · Cusco</p>
    <h1>Inteligencia andina para negocios reales.</h1>
  </div>
  <p class="cta">Te regalamos US$1,000 · todo octubre</p>
  <img class="puma" src="../../assets/img/marca/puma-cuerpo.webp" alt="">
</div>
</body>
</html>
